<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ezGradient" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="30%" stop-color="#172554" />
      <stop offset="65%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#ezGradient)" />
  
  <!-- Subtle Rim Light -->
  <circle cx="256" cy="256" r="239" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.22" />

  <!-- Eventzone Monogram Sign Mark -->
  <g fill="#ffffff" filter="url(#softShadow)">
    <!-- Left Arch & Top Lintel (Inverted L) -->
    <path d="
      M 158 140
      L 354 140
      A 14 14 0 0 1 366 154
      L 366 200
      A 12 12 0 0 1 354 212
      L 236 212
      A 10 10 0 0 0 226 222
      L 226 360
      A 12 12 0 0 1 214 372
      L 158 372
      A 12 12 0 0 1 146 360
      L 146 154
      A 14 14 0 0 1 158 140
      Z
    " />

    <!-- Right Pillar (Clean vertical column with clean slit separation) -->
    <rect 
      x="286" 
      y="234" 
      width="80" 
      height="138" 
      rx="12" 
      ry="12" 
    />
  </g>
</svg>